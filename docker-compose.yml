---
#
# docker-compose.yml: Jellyfin Deployment for Synology NAS & macOS
#
# This Docker Compose configuration simplifies the setup process for deploying
# Jellyfin, a media server for organizing and streaming your movies, music, and more.
#
# Service Included:
#   - Jellyfin: Provides a media server to stream and manage your media.
#
# Compatible with Synology NAS and macOS for flexible deployment.
#
# For setup instructions and additional configurations, visit:
# - Jellyfin Setup Guide: https://jellyfin.org/docs/
# - Marius Guide: https://mariushosting.com/synology-install-jellyfin-with-portainer/
#

version: "2.9"

#
# Setup default properties for all or most containers
#
x-default-container: &default-container  # YAML anchor for default container
  pull_policy: always                    # Ensure that the image is always pulled
  restart: on-failure:5                  # Restart the container on failure up to 5 times
  security_opt:                          # Configure container security options
    - no-new-privileges:true             # Disallow addition of additional privileges
  logging:                               # Configure container logging options
    driver: "json-file"                  # Use JSON file logging driver
    options:                             # Add container logging options
      max-size: ${LOG_MAX_SIZE}          # Maximum file size for logs files
      max-file: ${LOG_MAX_FILE}          # Maximum number of log files to retain

#
# Define the services section
#
services:
  #
  # Define the 'jellyfin' service
  #
  jellyfin:
    # Docker image and container information
    <<: *default-container                    # Pull in the default container information
    image: jellyfin/jellyfin:${JELLYFIN_TAG}  # Run using the specified tag
    container_name: jellyfin-${JELLYFIN_TAG}  # Container name for identification
    hostname: jellyfin                        # Set the container hostname
    user: ${DEFAULT_UID}:${DEFAULT_GID}       # Set the container user and group ID

    # Command used to check container health
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8096' || exit 1  # Check if port 8096 is open
      timeout: ${JELLYFIN_HEALTHCHECK_TIMEOUT}                          # Fail if the check exceeds this timeout
      interval: ${JELLYFIN_HEALTHCHECK_INTERVAL}                        # Run the health check at this interval
      start_period: ${JELLYFIN_HEALTHCHECK_START_PERIOD}                # Wait this period before starting health checks
      retries: 3                                                        # Mark as unhealthy after 3 failed attempts

    # Define the container environment
    environment:
      TZ: ${TZ}  # Set the container timezone

    # Define the host and container ports
    ports:
      - "${JELLYFIN_PORT}:8096"  # Jellyfin web UI port

    # Mount host directories into the container
    volumes:
      - ${JELLYFIN_CONFIG_PATH}:/config:rw  # Mount configuration directory
      - ${JELLYFIN_CACHE_PATH}:/cache:rw    # Mount cache directory
      - ${JELLYFIN_LOGS_PATH}:/logs:rw      # Mount logs directory
      - ${JELLYFIN_MEDIA_PATH}:/media:rw    # Mount media directory
      - ${JELLYFIN_MUSIC_PATH}:/music:rw    # Mount music directory

#
# Define the networks section
#
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}  # Use the name of the compose project
    ipam:                          # IP Address Management
      driver: default              # Use the default driver
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET}      # Subnet in CIDR format
          ip_range: ${COMPOSE_NETWORK_IP_RANGE}  # Range of IPs to allocate
          gateway: ${COMPOSE_NETWORK_GATEWAY}    # Gateway for the network
